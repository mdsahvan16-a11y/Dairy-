name: Build Bharat Dairy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Flutter project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP file not found"
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Prepare project
        run: |
          PUBSPEC=$(find extracted -name pubspec.yaml -print -quit)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC")
          if [ -f "BharatDairy_main_fixed.dart" ]; then
            cp BharatDairy_main_fixed.dart "$PROJECT_DIR/lib/main.dart"
          fi
          sed -i 's/intl: .*/intl: ^0.20.3/' "$PUBSPEC"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bharat-Dairy-APK
          path: extracted/**/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
