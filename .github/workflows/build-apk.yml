name: Build Bharat Dairy APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'bharat_dairy_flutter_project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project archive
        run: |
          unzip -q bharat_dairy_flutter_project.zip -d extracted
          test -d extracted/bharat_dairy

      - name: Generate Android platform files
        working-directory: extracted/bharat_dairy
        run: flutter create --platforms=android --org com.bharatdairy .

      - name: Install dependencies
        working-directory: extracted/bharat_dairy
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: extracted/bharat_dairy
        run: flutter analyze

      - name: Build release APK
        working-directory: extracted/bharat_dairy
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bharat-dairy-release-apk
          path: extracted/bharat_dairy/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
